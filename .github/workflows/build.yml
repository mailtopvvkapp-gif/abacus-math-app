name: Build Android APK and AAB

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Build Project & Compile
        run: |
          # 1. Backup your main.dart
          cp lib/main.dart /tmp/saved_main.dart

          # 2. Generate clean Android scaffolding cleanly
          flutter create . --platforms=android --org com.pvvk.abacus --project-name abacus_app --overwrite

          # 3. Add TTS dependency using Flutter CLI (no YAML syntax errors)
          flutter pub add flutter_tts

          # 4. Restore your abacus main.dart
          cp /tmp/saved_main.dart lib/main.dart

          # 5. Build Installable Test APK (Debug)
          flutter build apk --debug

          # 6. Build Release APK
          flutter build apk --release

          # 7. Build Play Store App Bundle (AAB)
          flutter build appbundle --release --no-tree-shake-icons

      - name: Upload Test APK
        uses: actions/upload-artifact@v4
        with:
          name: abacus-app-apk
          path: build/app/outputs/flutter-apk/*.apk

      - name: Upload Play Store AAB
        uses: actions/upload-artifact@v4
        with:
          name: abacus-playstore-aab
          path: build/app/outputs/bundle/release/*.aab
          
