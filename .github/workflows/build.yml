name: Build Android APK and AAB

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Build Android App
        run: |
          flutter create --platforms=android --org com.pvvk.abacus --project-name abacus_app app_build
          cd app_build
          flutter pub add flutter_tts
          cp ../lib/main.dart lib/main.dart
          sed -i '/<\/manifest>/i \    <queries>\n        <intent>\n            <action android:name="android.intent.action.TTS_SERVICE" />\n        </intent>\n    </queries>' android/app/src/main/AndroidManifest.xml
          flutter build apk --release --no-shrink
          flutter build appbundle --release --no-tree-shake-icons
          mkdir -p ../dist_apk ../dist_aab
          cp build/app/outputs/flutter-apk/*.apk ../dist_apk/
          cp build/app/outputs/bundle/release/*.aab ../dist_aab/

      - name: Upload Test APK
        uses: actions/upload-artifact@v4
        with:
          name: abacus-app-apk
          path: dist_apk/*.apk

      - name: Upload Play Store AAB
        uses: actions/upload-artifact@v4
        with:
          name: abacus-playstore-aab
          path: dist_aab/*.aab
          
