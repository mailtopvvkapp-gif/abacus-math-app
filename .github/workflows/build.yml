name: Build Android APK and AAB

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # Automatically generates missing android/ folder and Gradle files
      - name: Auto-generate Android Scaffolding
        run: |
          flutter create . --platforms=android --org com.pvvk.abacus
          flutter pub get

      # Injects Text-To-Speech queries permission into AndroidManifest.xml
      - name: Configure Android Permissions for TTS
        run: |
          sed -i '/<\/manifest>/i \    <queries>\n        <intent>\n            <action android:name="android.intent.action.TTS_SERVICE" />\n        </intent>\n    </queries>' android/app/src/main/AndroidManifest.xml

      - name: Build Installable Test APK
        run: flutter build apk --debug

      - name: Build Release APK
        run: flutter build apk --release

      - name: Build Play Store App Bundle (AAB)
        run: flutter build appbundle --release

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: abacus-app-apk
          path: build/app/outputs/flutter-apk/*.apk

      - name: Upload Play Store AAB
        uses: actions/upload-artifact@v4
        with:
          name: abacus-playstore-aab
          path: build/app/outputs/bundle/release/*.aab
