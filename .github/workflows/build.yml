name: Build Android APK and AAB

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Assemble & Compile Flutter App
        run: |
          # 1. Create a fresh project workspace
          flutter create --platforms=android --org com.pvvk.abacus --project-name abacus_app app_workspace
          cd app_workspace

          # 2. Add dependencies
          flutter pub add flutter_tts

          # 3. Copy your custom main.dart from the repository
          cp ../lib/main.dart lib/main.dart

          # 4. Enable Android TTS queries in AndroidManifest
          sed -i '/<\/manifest>/i \    <queries>\n        <intent>\n            <action android:name="android.intent.action.TTS_SERVICE" />\n        </intent>\n    </queries>' android/app/src/main/AndroidManifest.xml

          # 5. Build directly installable Universal APK
          flutter build apk --debug

          # 6. Build Google Play Bundle (.aab)
          flutter build appbundle --release --no-tree-shake-icons

          # 7. Move outputs to root directory for upload
          mkdir -p ../build_outputs/apk ../build_outputs/bundle
          cp build/app/outputs/flutter-apk/*.apk ../build_outputs/apk/
          cp build/app/outputs/bundle/release/*.aab ../build_outputs/bundle/

      - name: Upload Installable APK (For Mobile Testing)
        uses: actions/upload-artifact@v4
        with:
          name: abacus-app-apk
          path: build_outputs/apk/*.apk

      - name: Upload Google Play Store Bundle (AAB)
        uses: actions/upload-artifact@v4
        with:
          name: abacus-playstore-aab
          path: build_outputs/bundle/*.aab
          
